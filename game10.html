<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Кто что ест? 🍏</title>
    <style>
        /* Полный сброс для планшетов */
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: linear-gradient(135deg, #e0f7fa, #fff8e1); /* Очень мягкие, уютные цвета */
            font-family: system-ui, -apple-system, sans-serif;
        }

        /* Верхняя панель вечного прогресса знатока */
        .top-panel {
            position: absolute;
            top: 20px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: center;
            z-index: 10;
            pointer-events: none;
        }
        .counter {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 10px 40px;
            border-radius: 25px;
            border: 4px solid #4db6ac;
            font-size: 30px;
            color: #004d40;
            box-shadow: 0 8px 20px rgba(0,0,0,0.05);
            font-weight: bold;
        }

        /* Главный контейнер игры */
        .game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            padding-top: 60px;
            gap: 40px;
        }

        /* Крупное животное текущего раунда */
        .animal-box {
            font-size: 140px; /* Гигантский размер для привлечения внимания */
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.08));
        }

        /* Контейнер вариантов еды */
        .food-options {
            display: flex;
            justify-content: center;
            gap: 30px;
            width: 100%;
            max-width: 800px;
            padding: 0 20px;
        }

        /* Гигантские круглые карточки с едой под детский палец */
        .food-card {
            flex: 1;
            aspect-ratio: 1;
            max-width: 160px;
            background-color: #ffffff;
            border: 5px solid #fff;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 75px;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(0,0,0,0.06), inset 0 -8px 15px rgba(0,0,0,0.04);
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.2), border-color 0.2s ease;
        }

        /* Анимация при наведении/нажатии */
        .food-card:active {
            transform: scale(0.9);
        }

        /* Эффект правильного выбора (летит и увеличивается) */
        .food-card.correct-anim {
            animation: zoomEat 0.5s ease-in-out forwards;
            border-color: #81c784;
            background-color: #e8f5e9;
            pointer-events: none;
        }
        @keyframes zoomEat {
            0% { transform: scale(1); }
            50% { transform: scale(1.2) translateY(-80px); opacity: 0.8; }
            100% { transform: scale(0) translateY(-200px); opacity: 0; }
        }

        /* Мягкая анимация ошибки ("нет-нет") */
        .food-card.wrong-anim {
            animation: shakeNo 0.4s ease-in-out;
            border-color: #ffb74d;
        }
        @keyframes shakeNo {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-12px); }
            40%, 80% { transform: translateX(12px); }
        }

        /* Радостный прыжок животного, когда его покормили */
        .animal-box.happy {
            animation: happyJump 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.5) forwards;
        }
        @keyframes happyJump {
            0%, 100% { transform: scale(1) translateY(0); }
            50% { transform: scale(1.15) translateY(-30px); }
        }
    </style>
</head>
<body>

<!-- Панель постоянного сохранения прогресса знатока -->
<div class="top-panel">
    <div class="counter" id="score-display">⭐ ЗНАТОК: 0</div>
</div>

<div class="game-container">
    <!-- Животное раунда -->
    <div class="animal-box" id="animal">🐰</div>

    <!-- 3 варианта еды под ним -->
    <div class="food-options" id="foodZone"></div>
</div>
<script>
    const animalEl = document.getElementById('animal');
    const foodZone = document.getElementById('foodZone');
    const scoreDisplay = document.getElementById('score-display');

    // Наша добрая база данных животных и их правильной еды
    const gamePairs = [
        { animal: '🐰', correct: '🥕', name: 'Зайка' },
        { animal: '🐱', correct: '🐟', name: 'Котик' },
        { animal: '🐶', correct: '🦴', name: 'Собачка' },
        { animal: '🐵', correct: '🍌', name: 'Обезьянка' },
        { animal: '🐭', correct: '🧀', name: 'Мышка' },
        { animal: '🐻', correct: '🍯', name: 'Мишка' }
    ];

    // Вся остальная еда, которая будет использоваться для создания неправильных вариантов
    const allFoodPool = ['🥕', '🐟', '🦴', '🍌', '🧀', '🍯', '🍎', '🍉', '🍓', '🍇'];

    let currentRoundData = null;
    let scoreCount = 0;
    let db = null;
    let lockSelection = false;

    // Подключение к IndexedDB для вечного сохранения очков Знатока
    const request = indexedDB.open("BabyYummyMatchDB", 1);
    request.onupgradeneeded = (e) => {
        db = e.target.result;
        db.createObjectStore("progress", { keyPath: "id" });
    };
    request.onsuccess = (e) => {
        db = e.target.result;
        loadProgress();
    };

    function saveProgress() {
        if (!db) return;
        const tx = db.transaction("progress", "readwrite");
        const store = tx.objectStore("progress");
        store.put({ id: "yummyScore", val: scoreCount });
    }

    function loadProgress() {
        if (!db) return;
        const tx = db.transaction("progress", "readonly");
        const store = tx.objectStore("progress");
        const getReq = store.get("yummyScore");
        getReq.onsuccess = () => {
            if (getReq.result) {
                scoreCount = getReq.result.val;
                scoreDisplay.innerText = `⭐ ЗНАТОК: ${scoreCount}`;
            }
        };
    }

    // WEB AUDIO API: Мягкие звуки колокольчиков и нежная колыбельная
    let audioCtx = null;
    let isMusicPlaying = false;

    function initAudio() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            startBackgroundLullaby();
        }
        if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playSoftTone(freq, duration = 0.6, volume = 0.15) {
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = 'sine'; // Мягкая чистая синусоида
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

        gain.gain.setValueAtTime(0, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(volume, audioCtx.currentTime + 0.05);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);

        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
    }

    // Спокойная музыкальная шкатулка на фоне
    function startBackgroundLullaby() {
        if (isMusicPlaying) return;
        isMusicPlaying = true;

        const melody = [261.63, 329.63, 392.00, 329.63, 440.00, 392.00, 293.66, 329.63];
        let noteIndex = 0;

        function playNextNote() {
            if (!audioCtx) return;
            playSoftTone(melody[noteIndex], 1.5, 0.02); // Экстремально тихо
            noteIndex = (noteIndex + 1) % melody.length;
            setTimeout(playNextNote, 1500);
        }

        playNextNote();
    }

    // Запуск нового раунда
    function nextRound() {
        lockSelection = false;
        animalEl.classList.remove('happy');

        // Выбираем случайное животное из базы
        currentRoundData = gamePairs[Math.floor(Math.random() * gamePairs.length)];
        animalEl.innerText = currentRoundData.animal;

        // Собираем варианты еды: 1 правильный + 2 случайных неправильных
        const options = [currentRoundData.correct];
        
        while (options.length < 3) {
            const randomFood = allFoodPool[Math.floor(Math.random() * allFoodPool.length)];
            // Следим, чтобы еда не повторялась в тройке вариантов
            if (!options.includes(randomFood)) {
                options.push(randomFood);
            }
        }

        // Перемешиваем три карточки с едой алгоритмом Фишера-Йетса
        for (let i = options.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [options[i], options[j]] = [options[j], options[i]];
        }

        // Отрисовываем карточки на экране
        foodZone.innerHTML = '';
        options.forEach(food => {
            const card = document.createElement('div');
            card.classList.add('food-card');
            card.innerText = food;

            card.addEventListener('pointerdown', (e) => {
                e.preventDefault();
                handleFoodClick(card, food);
            });

            foodZone.appendChild(card);
        });
    }

    // Логика выбора еды ребёнком
    function handleFoodClick(card, selectedFood) {
        initAudio(); // Включаем звук при первом клике
        if (lockSelection) return;

        // Если малыш угадал правильную еду
        if (selectedFood === currentRoundData.correct) {
            lockSelection = true;
            
            // Запускаем нежную победную ноту колыбельной
            playSoftTone(523.25, 0.8, 0.15);

            // Включаем анимацию полета еды в рот и прыжка животного
            card.classList.add('correct-anim');
            animalEl.classList.add('happy');

            // Начисляем балл Знатока
            scoreCount++;
            scoreDisplay.innerText = `⭐ ЗНАТОК: ${scoreCount}`;
            saveProgress();

            // Через 1.5 секунды переходим к следующему животному
            setTimeout(nextRound, 1500);

        } else {
            // Если малыш ошибся
            // Включаем мягкую анимацию покачивания "нет-нет"
            card.classList.add('wrong-anim');
            
            // Играем тихий, низкий, не пугающий звук ошибки
            playSoftTone(196.00, 0.3, 0.08);

            // Убираем класс анимации через 400мс, чтобы карточку можно было нажать снова
            setTimeout(() => {
                card.classList.remove('wrong-anim');
            }, 400);
        }
    }

    // Старт игры при открытии страницы
    window.addEventListener('load', nextRound);
</script>
</body>
</html>
