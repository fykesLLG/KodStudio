<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Лопни шарик! МЕГА ВОЛНЫ</title>
    <style>
        /* Базовые настройки для планшета */
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: linear-gradient(to bottom, #b3e5fc, #fff9c4);
            font-family: 'Arial Black', sans-serif;
        }
        
        /* Верхняя панель со счетом и уровнями */
        .scoreboard {
            position: absolute;
            top: 15px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 10;
            pointer-events: none;
            font-size: 28px;
            color: #2e7d32;
            text-shadow: 2px 2px 0px #fff, -2px -2px 0px #fff, 2px -2px 0px #fff, -2px 2px 0px #fff;
        }
        .score-item {
            background: rgba(255, 255, 255, 0.8);
            padding: 8px 20px;
            border-radius: 20px;
            border: 3px solid #4caf50;
        }
        
        /* Стили самих шариков */
        .balloon {
            position: absolute;
            border-radius: 50%;
            cursor: pointer;
            animation: floatUp var(--speed) linear forwards;
            box-shadow: inset -15px -15px 25px rgba(0,0,0,0.2), 0 15px 20px rgba(0,0,0,0.15);
        }
        .balloon::after {
            content: "";
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            border-left: 8px solid transparent;
            border-right: 8px solid transparent;
            border-bottom: 12px solid currentColor;
        }
        @keyframes floatUp {
            0% { transform: translateY(105vh); }
            100% { transform: translateY(-25vh); }
        }
        
        /* Текст BOOM! при лопании */
        .boom-text {
            position: absolute;
            font-size: 45px;
            font-weight: bold;
            color: #ff3d00;
            text-shadow: 3px 3px 0px #fff, -3px -3px 0px #fff, 3px -3px 0px #fff, -3px 3px 0px #fff;
            pointer-events: none;
            animation: textPop 0.5s ease-out forwards;
            z-index: 5;
        }
        @keyframes textPop {
            0% { transform: scale(0.5) rotate(-15deg); opacity: 1; }
            50% { transform: scale(1.4) rotate(15deg); }
            100% { transform: scale(1) rotate(0deg); opacity: 0; }
        }
        
        /* Частицы взрыва шарика */
        .particle {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
            animation: explode 0.4s ease-out forwards;
        }
        @keyframes explode {
            0% { transform: translate(0, 0) scale(1); opacity: 1; }
            100% { transform: translate(var(--dx), var(--dy)) scale(0); opacity: 0; }
        }
    </style>
</head>
<body>

<div class="scoreboard">
    <div class="score-item" id="lvl-display">УРОВЕНЬ: 1</div>
    <div class="score-item" id="score-display">🎈: 0 / 5</div>
    <div class="score-item" id="record-display" style="border-color: #ff9100; color: #e65100;">🏆: 0</div>
</div>
<script>
    const colors = ['#ff1744', '#f50057', '#d500f9', '#651fff', '#3d5afe', '#2979ff', '#00b0ff', '#00e5ff', '#1de9b6', '#00e676', '#76ff03', '#c6ff00', '#ffea00', '#ffc400', '#ff9100', '#ff3d00'];
    
    let score = 0;
    let totalScore = 0; 
    let level = 1;
    let balloonsToPass = 5;
    let baseSpeed = 5.5; 
    let record = 0;
    let db = null;
    let spawnIntervalId = null;

    // База данных для сохранения рекорда малыша
    const request = indexedDB.open("BabyBalloonDB", 1);
    request.onupgradeneeded = (e) => {
        db = e.target.result;
        db.createObjectStore("saveData", { keyPath: "id" });
    };
    request.onsuccess = (e) => {
        db = e.target.result;
        loadRecord();
    };

    function saveRecord() {
        if (!db) return;
        const tx = db.transaction("saveData", "readwrite");
        const store = tx.objectStore("saveData");
        store.put({ id: "highscore", val: record });
    }

    function loadRecord() {
        if (!db) return;
        const tx = db.transaction("saveData", "readonly");
        const store = tx.objectStore("saveData");
        const getReq = store.get("highscore");
        getReq.onsuccess = () => {
            if (getReq.result) {
                record = getReq.result.val;
                document.getElementById('record-display').innerText = `🏆: ${record}`;
            }
        };
    }

    // Жирный и громкий звук БАХ!
    let audioCtx = null;
    function playPopSound() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();

        const osc1 = audioCtx.createOscillator();
        const osc2 = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        
        osc1.type = 'sawtooth'; 
        osc2.type = 'sine';      
        
        osc1.frequency.setValueAtTime(300, audioCtx.currentTime);
        osc1.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.15);
        
        osc2.frequency.setValueAtTime(150, audioCtx.currentTime);
        osc2.frequency.exponentialRampToValueAtTime(10, audioCtx.currentTime + 0.15);
        
        gain.gain.setValueAtTime(0.9, audioCtx.currentTime); 
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
        
        osc1.connect(gain);
        osc2.connect(gain);
        gain.connect(audioCtx.destination);
        
        osc1.start();
        osc2.start();
        osc1.stop(audioCtx.currentTime + 0.15);
        osc2.stop(audioCtx.currentTime + 0.15);
    }

    // Создание одного шарика
    function createBalloon() {
        const balloon = document.createElement('div');
        balloon.classList.add('balloon');
        
        const size = Math.floor(Math.random() * 50) + 120; 
        balloon.style.width = `${size}px`;
        balloon.style.height = `${size * 1.2}px`;
        
        const color = colors[Math.floor(Math.random() * colors.length)];
        balloon.style.backgroundColor = color;
        balloon.style.color = color;
        
        const xPos = Math.random() * (window.innerWidth - size);
        balloon.style.left = `${xPos}px`;
        
        const currentSpeed = Math.max(2.2, baseSpeed - (level * 0.25));
        balloon.style.setProperty('--speed', `${currentSpeed}s`);
        
        balloon.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            popBalloon(balloon, color, e.clientX, e.clientY);
        });
        
        balloon.addEventListener('animationend', () => { balloon.remove(); });
        document.body.appendChild(balloon);
    }

    // Логика волны: +2 шарика за раз с каждым уровнем
    function spawnWave() {
        const balloonsCount = 1 + (level - 1) * 2; 
        for (let i = 0; i < balloonsCount; i++) {
            setTimeout(createBalloon, i * 200);
        }
    }

    // Клик по шарику
    function popBalloon(balloon, color, x, y) {
        playPopSound();
        createParticles(x, y, color);
        createBoomText(x, y);
        balloon.remove();
        
        score++;
        totalScore++;
        
        if (totalScore > record) {
            record = totalScore;
            document.getElementById('record-display').innerText = `🏆: ${record}`;
            saveRecord();
        }

        if (score >= balloonsToPass) {
            level++;
            score = 0;
            balloonsToPass += 5; 
            document.getElementById('lvl-display').innerText = `УРОВЕНЬ: ${level}`;
            updateSpawnTimer();
        }
        
        document.getElementById('score-display').innerText = `🎈: ${score} / ${balloonsToPass}`;
    }

    // Текст BOOM!
    function createBoomText(x, y) {
        const txt = document.createElement('div');
        txt.classList.add('boom-text');
        txt.innerText = 'BOOM!';
        txt.style.left = `${x - 60}px`;
        txt.style.top = `${y - 30}px`;
        document.body.appendChild(txt);
        txt.addEventListener('animationend', () => { txt.remove(); });
    }

    // Эффект взрыва частиц
    function createParticles(x, y, color) {
        for (let i = 0; i < 16; i++) {
            const particle = document.createElement('div');
            particle.classList.add('particle');
            particle.style.backgroundColor = color;
            const pSize = Math.random() * 20 + 10;
            particle.style.width = `${pSize}px`;
            particle.style.height = `${pSize}px`;
            particle.style.left = `${x - pSize/2}px`;
            particle.style.top = `${y - pSize/2}px`;
            
            const angle = Math.random() * Math.PI * 2;
            const distance = Math.random() * 150 + 60;
            particle.style.setProperty('--dx', `${Math.cos(angle) * distance}px`);
            particle.style.setProperty('--dy', `${Math.sin(angle) * distance}px`);
            
            document.body.appendChild(particle);
            particle.addEventListener('animationend', () => { particle.remove(); });
        }
    }

    function updateSpawnTimer() {
        if (spawnIntervalId) clearInterval(spawnIntervalId);
        const intervalTime = Math.max(1000, 1600 - (level * 50));
        spawnIntervalId = setInterval(spawnWave, intervalTime);
    }

    // Запуск
    spawnWave();
    updateSpawnTimer();
</script>
</body>
</html>
